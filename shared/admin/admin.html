<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLMProxy 控制台</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- 46px Top Navigation Bar -->
  <header class="top">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
      <span>llmproxy</span>
      <span id="brandRole" class="brand-badge">Hub</span>
    </div>

    <nav class="seg" id="navSeg">
      <button class="seg-btn" id="navModels" data-tab="models" hidden>模型与路由</button>
      <button class="seg-btn active" id="navProviders" data-tab="providers">供应商</button>
      <button class="seg-btn" id="navNodes" data-tab="nodes" hidden>中转节点</button>
      <button class="seg-btn" id="navActivity" data-tab="activity" hidden>统计与轨迹</button>
      <button class="seg-btn" id="navSettings" data-tab="settings">设置</button>
    </nav>

    <div class="top-actions">
      <div id="modeSwitchBox" class="seg" hidden>
        <button id="modeBtnAgent" class="seg-btn active">Agent</button>
        <button id="modeBtnKB" class="seg-btn">KB</button>
      </div>
      <div id="topVersionBox">
        <span id="configVersionDisplay" class="pill pill--accent">v1</span>
      </div>
      <button id="themeToggleBtn" class="btn btn--sm" title="切换深色/浅色">🌓</button>
      <button id="logoutBtn" class="btn btn--sm">退出</button>
    </div>
  </header>

  <!-- Max-Width 920px Central Corridor -->
  <main class="corridor">
    <!-- Hub Sync Bar (Full Node Only) -->
    <div id="vaultSyncBar" class="section-bar mb-3" hidden>
      <div class="name">
        <span id="vaultSyncTitle">☁️ EdgeOne 中枢同步</span>
        <span id="vaultSyncBadge" class="pill pill--green">在线</span>
      </div>
      <div class="fields">
        <button class="btn btn--sm" id="btnSyncManifest">拉取清单</button>
        <button class="btn btn--sm btn--primary" id="btnSyncKeys">从 Vault 同步</button>
      </div>
    </div>

    <!-- 1. View: Models & Routes (Full Role Only) -->
    <section id="viewModels" hidden>
      <div class="section-bar">
        <h2 class="section-title">模型与路由分发</h2>
        <button id="btnAddModel" class="btn primary sm" type="button">＋ 添加模型</button>
      </div>

      <!-- Inline Add Model Form -->
      <div class="list mb-3 hidden" id="addModelForm" hidden>
        <div class="editor">
          <div class="editor-grid">
            <div class="form-group"><label class="form-label">逻辑模型名称</label><input class="input" id="newModelName" placeholder="如：gpt-4o-mini"></div>
            <div class="form-group"><label class="form-label">候选供应商</label><select class="select" id="newModelProvider"></select></div>
            <div class="form-group"><label class="form-label">上游目标模型 ID</label><input class="input input--code" id="newModelTarget" placeholder="留空同逻辑名"></div>
          </div>
          <div class="section-bar mt-3 flex-end gap-2">
            <button class="btn sm" id="btnCancelAddModel" type="button">取消</button>
            <button class="btn primary sm" id="btnConfirmAddModel" type="button">确认添加模型</button>
          </div>
        </div>
      </div>

      <div class="list" id="modelsList"></div>
    </section>

    <!-- 2. View: Providers (Hub & Full Role) -->
    <section id="viewProviders">
      <div class="section-bar">
        <h2 class="section-title">供应商与密钥池</h2>
        <button id="btnAddProvider" class="btn primary sm" type="button">＋ 添加供应商</button>
      </div>

      <!-- Inline Add Provider Form -->
      <div class="list mb-3 hidden" id="addProviderForm" hidden>
        <div class="editor">
          <div class="editor-grid">
            <div class="form-group"><label class="form-label">预设模板</label><select class="select" id="newProvPreset"><option value="custom">自定义</option><option value="openai">OpenAI</option><option value="anthropic">Anthropic</option><option value="gemini">Gemini</option><option value="deepseek">DeepSeek</option><option value="openrouter">OpenRouter</option><option value="siliconflow">SiliconFlow</option><option value="groq">Groq</option><option value="xai">xAI</option></select></div>
            <div class="form-group"><label class="form-label">供应商 ID</label><input class="input input--code" id="newProvId" placeholder="openai"></div>
            <div class="form-group"><label class="form-label">显示名称</label><input class="input" id="newProvName" placeholder="OpenAI"></div>
            <div class="form-group"><label class="form-label">Base URL</label><input class="input input--code" id="newProvBaseUrl" placeholder="https://api.openai.com/v1"></div>
            <div class="form-group"><label class="form-label">协议类型</label><select class="select" id="newProvApiType"><option value="openai-completions">openai-completions</option><option value="anthropic-messages">anthropic-messages</option><option value="gemini">gemini</option></select></div>
            <div class="form-group"><label class="form-label">初始 Key 别名</label><input class="input" id="newProvKeyAlias" value="k1"></div>
            <div class="form-group"><label class="form-label">初始 API Key</label><input class="input input--code" id="newProvApiKey" placeholder="sk-..."></div>
          </div>
          <div class="section-bar mt-3 flex-end gap-2">
            <button class="btn sm" id="btnCancelAddProvider" type="button">取消</button>
            <button class="btn primary sm" id="btnConfirmAddProvider" type="button">确认创建并保存</button>
          </div>
        </div>
      </div>

      <div class="list" id="providersList"></div>
    </section>

    <!-- 3. View: Nodes (Hub Role Only) -->
    <section id="viewNodes" hidden>
      <div class="section-bar">
        <h2 class="section-title">中转节点管理</h2>
        <button class="btn btn--primary" id="btnIssueNode">＋ 签发新节点</button>
      </div>

      <!-- Inline Issue Form -->
      <div class="list mb-3" id="issueNodeForm" hidden>
        <div class="editor">
          <div class="editor-grid">
            <div class="form-group">
              <label class="form-label">节点名称</label>
              <input class="input" id="issueNodeName" placeholder="如：香港 NAT 小鸡 01">
            </div>
            <div class="form-group">
              <label class="form-label">节点角色</label>
              <select class="select" id="issueNodeRole">
                <option value="lite" selected>lite (NAT 极简节点，纯内存零落盘)</option>
                <option value="full">full (标准完整节点，含本地持久化)</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">租约时长 (秒)</label>
              <input class="input" id="issueNodeTTL" type="number" value="86400">
            </div>
          </div>
          <div class="section-bar mt-3 flex-end">
            <button class="btn btn--primary" id="btnDoIssue">生成 Token 并签发</button>
          </div>
          <div class="form-group mt-3" id="issuedTokenDisplay" hidden>
            <label class="form-label text-danger">一次性 NODE_TOKEN (刷新页面后不再显示，请立即保存):</label>
            <input class="input input--code" id="issuedTokenVal" readonly>
            <label class="form-label mt-2">一键启动命令:</label>
            <input class="input input--code" id="issuedEnvVal" readonly>
          </div>
        </div>
      </div>

      <div class="list" id="nodesList"></div>
    </section>

    <!-- 4. View: Activity & Traces (Full Role Only) -->
    <section id="viewActivity" hidden>
      <div class="stat-summary">
        <div class="stat-card">
          <div class="stat-label">总请求数</div>
          <div class="stat-val" id="statRequests">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">成功率</div>
          <div class="stat-val" id="statSuccess">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">总 Token</div>
          <div class="stat-val" id="statTokens">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">平均 TTFT</div>
          <div class="stat-val" id="statTTFT">-</div>
        </div>
      </div>

      <div class="section-bar">
        <h2 class="section-title">模型用量分布 (Models)</h2>
        <div class="seg" id="activityPeriodSeg">
          <button class="seg-btn active" data-period="today">今日</button>
          <button class="seg-btn" data-period="7d">近 7 天</button>
          <button class="seg-btn" data-period="30d">近 30 天</button>
          <button class="seg-btn" data-period="all">全部</button>
        </div>
      </div>
      <div class="list mb-3" id="usageModelsList"></div>

      <div class="section-bar">
        <h2 class="section-title">最近 60 条请求轨迹回放 (Recent Traces)</h2>
      </div>
      <div class="list" id="tracesList"></div>
    </section>

    <!-- 5. View: Settings (Hub & Full Role) -->
    <section id="viewSettings" hidden>
      <div class="section-bar">
        <h2 class="section-title">全局运行时设置</h2>
        <button class="btn btn--primary" id="btnSaveSettings">保存设置</button>
      </div>

      <div class="list">
        <div class="editor">
          <div class="editor-grid">
            <div class="form-group">
              <label class="form-label">默认调度策略</label>
              <select class="select" id="cfgRoutingStrategy">
                <option value="sticky_failover">粘性故障转移 (sticky_failover)</option>
                <option value="round_robin">标准轮询 (round_robin)</option>
                <option value="manual">手动严格直通 (manual)</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">首字节超时 (秒，总硬超时固定300s)</label>
              <input class="input" id="cfgFirstByteTimeout" type="number" value="120">
            </div>
            <div class="form-group">
              <label class="form-label">429 限流冷却秒数</label>
              <input class="input" id="cfgCooldown429" type="number" value="15">
            </div>
            <div class="form-group">
              <label class="form-label">5xx 服务端错误冷却秒数</label>
              <input class="input" id="cfgCooldown5xx" type="number" value="30">
            </div>
            <div class="form-group">
              <label class="form-label">网络错误冷却秒数</label>
              <input class="input" id="cfgCooldownNet" type="number" value="15">
            </div>
            <div class="form-group">
              <label class="form-label">401/403 鉴权错误冷却秒数</label>
              <input class="input" id="cfgCooldownAuth" type="number" value="86400">
            </div>
            <div class="form-group" id="cfgVaultUrlGroup" hidden>
              <label class="form-label">EdgeOne Hub 中枢 URL</label>
              <input class="input input--code" id="cfgVaultUrl" placeholder="如 https://hub.example.com">
            </div>
            <div class="form-group" id="cfgVaultTokenGroup" hidden>
              <label class="form-label">Hub NODE_TOKEN 访问凭据</label>
              <input class="input input--code" id="cfgVaultToken" placeholder="如 stk_node_...">
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="toast-box" id="toastBox"></div>

  <script src="js/host.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
