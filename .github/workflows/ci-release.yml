name: CI & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  verify-gates:
    name: Verify Release Gates (G1~G6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Go 1.22+
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run G1~G6 Release Gatekeeper
        run: npm run verify:release

  build-release:
    name: Build & Release Artifacts
    needs: verify-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Go 1.22+
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Cross-compile Release Binaries
        run: npm run build:release

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llmproxy2-release-binaries
          path: dist/*

      - name: Publish GitHub Release (v* Tags Only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-release:
    name: Build & Push Container Image (ghcr.io)
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Release Binaries
        uses: actions/download-artifact@v4
        with:
          name: llmproxy2-release-binaries
          path: dist

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read release metadata
        id: meta
        run: |
          VERSION=$(node -p "require('./version.json').version")
          SEMVER=$(node -p "require('./version.json').semver")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Images are pushed for both architectures so the panel's one-liner works
      # on x86_64 and arm64 hosts alike. Tags: latest on main, version on tags.
      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            TARGETARCH=amd64
            VERSION=${{ steps.meta.outputs.version }}
            SEMVER=${{ steps.meta.outputs.semver }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/khc8655/ocrprox2:${{ github.sha }}-amd64
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/khc8655/ocrprox2:{0}-amd64', github.ref_name) || format('ghcr.io/khc8655/ocrprox2:latest-amd64') }}

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            TARGETARCH=arm64
            VERSION=${{ steps.meta.outputs.version }}
            SEMVER=${{ steps.meta.outputs.semver }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/khc8655/ocrprox2:${{ github.sha }}-arm64
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/khc8655/ocrprox2:{0}-arm64', github.ref_name) || format('ghcr.io/khc8655/ocrprox2:latest-arm64') }}

      - name: Assemble multi-arch manifest
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then TAG=latest; else TAG="${GITHUB_REF_NAME}"; fi
          docker buildx imagetools create \
            -t "ghcr.io/khc8655/ocrprox2:${TAG}" \
            "ghcr.io/khc8655/ocrprox2:${GITHUB_SHA}-amd64" \
            "ghcr.io/khc8655/ocrprox2:${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect "ghcr.io/khc8655/ocrprox2:${TAG}"
